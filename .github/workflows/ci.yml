name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write

env:
  NODE_VERSION: 22
  IS_PROD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:headings
      - name: check-placeholders (prod only)
        if: env.IS_PROD == 'true'
        run: pnpm check:placeholders
      - run: pnpm build
        env:
          # TODO(Q9): hero footage/poster only on previews until the template licence is confirmed.
          NEXT_PUBLIC_HERO_MEDIA: ${{ env.IS_PROD == 'true' && 'off' || 'on' }}
      - run: pnpm check:js-budget
      - name: Strip hero media from production output (Q9)
        if: env.IS_PROD == 'true'
        run: rm -rf out/media/hero
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          retention-days: 7

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
      - run: pnpm lhci
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci/reports

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ vars.CF_PAGES_PROJECT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          pnpm exec wrangler pages deploy out
          --project-name=${{ vars.CF_PAGES_PROJECT }}
          --branch=${{ github.head_ref || github.ref_name }}
          --commit-hash=${{ github.sha }}
