<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fintech Provider Hub (Copy)</title>
<meta name="description" content="White-label crypto wallets, virtual card programs, global payments and custom fintech development from Hong Kong.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=Manrope:wght@500..800&display=swap" rel="stylesheet">
<style>
/* layout idea: cold graphite "infrastructure" shell, warm product screens as the only hot color; light paper sections for reading */
:root{
  --bg:#070B14; --bg-2:#0C1220; --bg-3:#121A2C; --line:rgba(150,168,214,.14); --line-2:rgba(150,168,214,.24);
  --fg:#EDF0F7; --fg-2:#9EA8BF;
  --blue:#5B8CFF; --violet:#A07EFF; --blue-ink:#2A55D6;
  --paper:#F2F4F9; --paper-fg:#0B1120; --paper-2:#4A5367; --paper-line:#DCE1EB; --card:#FFFFFF;
  --ok:#3DD39A; --ok-ink:#0C7A52;
  --display:'Manrope',ui-sans-serif,system-ui,sans-serif; --body:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}
img,svg{max-width:100%}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:100}
.skip:focus{left:16px}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.sec{padding:104px 0;position:relative}
.sec.tight{padding:72px 0}
.light{background:var(--paper);color:var(--paper-fg)}
.light .muted{color:var(--paper-2)}
.muted{color:var(--fg-2)}
.sec-head{max-width:760px;display:flex;flex-direction:column;gap:16px;margin-bottom:52px}
.h2{font-size:clamp(30px,4.2vw,50px);font-weight:800;line-height:1.06;letter-spacing:-.035em}
.h3{font-size:22px;font-weight:700;line-height:1.2}
.lead-p{font-size:clamp(17px,1.5vw,19px);line-height:1.55;max-width:62ch}
.eyebrow{font:600 13px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--blue);display:inline-flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:2px;background:linear-gradient(135deg,var(--blue),var(--violet))}
.light .eyebrow{color:var(--blue-ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;padding:0 24px;border-radius:14px;font:600 16px/1 var(--body);text-decoration:none;border:1px solid transparent;cursor:pointer;transition:transform .15s ease,background .2s ease,border-color .2s ease;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn-p{background:var(--fg);color:var(--bg)}
.btn-p:hover{background:#fff}
.btn-g{border-color:var(--line-2);color:var(--fg);background:rgba(255,255,255,.03)}
.btn-g:hover{border-color:rgba(150,168,214,.45)}
.btn-blue{background:var(--blue);color:#fff}
.btn-blue:hover{background:#6E9AFF}
.light .btn-g{border-color:var(--paper-line);color:var(--paper-fg);background:#fff}
.btn-sm{height:40px;padding:0 16px;border-radius:11px;font-size:14px}
.tg-ico{width:20px;height:20px;flex:none}
.arrow-link{display:inline-flex;align-items:center;gap:8px;font-weight:600;text-decoration:none;color:var(--blue)}
.light .arrow-link{color:var(--blue-ink)}
.arrow-link svg{transition:transform .2s ease}
.arrow-link:hover svg{transform:translateX(3px)}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;font:600 12px/1 var(--body);letter-spacing:.01em;white-space:nowrap;border:1px solid}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill-core{color:var(--ok);border-color:rgba(61,211,154,.35);background:rgba(61,211,154,.08)}
.pill-partner{color:#8EB0FF;border-color:rgba(91,140,255,.4);background:rgba(91,140,255,.08)}
.pill-addon{color:#C3ABFF;border-color:rgba(160,126,255,.4);background:rgba(160,126,255,.08)}
.pill-roadmap{color:#B7BFD0;border-color:rgba(183,191,208,.3);background:rgba(183,191,208,.06)}
.light .pill-core{color:var(--ok-ink);border-color:#9FDDC4;background:#E7F7F0}
.light .pill-partner{color:var(--blue-ink);border-color:#B9CBFA;background:#EDF2FF}
.light .pill-addon{color:#5B37C9;border-color:#D2C3FB;background:#F3EEFF}
.light .pill-roadmap{color:#4A5367;border-color:#D4D9E3;background:#EEF0F5}
.pills{display:flex;flex-wrap:wrap;gap:8px}

/* header */
.hdr{position:sticky;top:0;z-index:50;background:rgba(7,11,20,.78);backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid var(--line)}
.hdr-in{height:70px;display:flex;align-items:center;gap:28px}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font:800 16px/1.1 var(--display);letter-spacing:-.01em;flex:none}
.logo small{display:block;font:500 11px/1 var(--body);color:var(--fg-2);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.nav{display:flex;align-items:center;gap:4px;margin-left:auto}
.nav>a,.nav .dd>button{height:40px;padding:0 12px;border-radius:10px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--fg-2);font:500 15px/1 var(--body);background:none;border:0;cursor:pointer}
.nav>a:hover,.nav .dd>button:hover,.nav>a[aria-current="page"]{color:var(--fg);background:rgba(255,255,255,.05)}
.dd{position:relative}
.dd-panel{position:absolute;top:100%;left:-12px;width:560px;padding:10px;margin-top:8px;border-radius:18px;background:var(--bg-2);border:1px solid var(--line-2);box-shadow:0 30px 60px -20px rgba(0,0,0,.7);display:grid;grid-template-columns:1fr 1fr;gap:4px;opacity:0;visibility:hidden;transform:translateY(-4px);transition:opacity .18s ease,transform .18s ease,visibility .18s}
.dd-panel::before{content:"";position:absolute;left:0;right:0;top:-12px;height:12px}
.dd:hover .dd-panel,.dd:focus-within .dd-panel{opacity:1;visibility:visible;transform:none}
.dd-panel a{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:12px;text-decoration:none}
.dd-panel a:hover{background:rgba(255,255,255,.05)}
.dd-panel b{font:700 15px/1.2 var(--display)}
.dd-panel span{font-size:13px;line-height:1.45;color:var(--fg-2)}
.hdr-r{display:flex;align-items:center;gap:10px}
.lang{display:inline-flex;height:40px;border:1px solid var(--line-2);border-radius:11px;padding:3px;gap:2px}
.lang a,.lang span{min-width:38px;display:flex;align-items:center;justify-content:center;border-radius:8px;font:600 13px/1 var(--body);text-decoration:none;color:var(--fg-2)}
.lang span{background:rgba(255,255,255,.1);color:var(--fg)}
.lang a:hover{color:var(--fg)}
.menu-btn{display:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line-2);background:none;color:var(--fg);align-items:center;justify-content:center;cursor:pointer}
.mnav{display:none}
@media (max-width:1060px){
  .nav,.hdr-r .btn{display:none}
  .menu-btn{display:inline-flex}
  .hdr-r{margin-left:auto}
  .hdr.open .mnav{display:flex}
  .mnav{position:absolute;top:70px;left:0;right:0;height:calc(100dvh - 70px);overflow:auto;background:var(--bg);flex-direction:column;padding:16px 24px 32px;gap:4px;border-top:1px solid var(--line)}
  .mnav a{padding:14px 4px;text-decoration:none;font:600 18px/1.2 var(--display);border-bottom:1px solid var(--line)}
  .mnav .sub{font:500 16px/1.2 var(--body);color:var(--fg-2);padding-left:16px}
  .mnav .btn{margin-top:20px;border-bottom:0;font:600 16px/1 var(--body)}
}

/* hero */
.hero{position:relative;overflow:hidden;padding:72px 0 88px}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;-webkit-mask-image:radial-gradient(70% 80% at 70% 40%,#000 0%,transparent 75%);mask-image:radial-gradient(70% 80% at 70% 40%,#000 0%,transparent 75%);opacity:.55;pointer-events:none}
.hero-in{position:relative;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:48px;align-items:center}
.hero h1{font-size:clamp(42px,6.4vw,82px);font-weight:800;line-height:.98;letter-spacing:-.045em;margin:22px 0 24px}
.hero .lead-p{color:var(--fg-2)}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.specs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:56px;border-top:1px solid var(--line)}
.specs div{padding:18px 18px 0 0;display:flex;flex-direction:column;gap:6px}
.specs div+div{padding-left:18px;border-left:1px solid var(--line)}
.specs dt{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2)}
.specs dd{margin:0;font:700 16px/1.3 var(--display)}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px}
.stage::before{content:"";position:absolute;width:120%;aspect-ratio:1;left:50%;top:44%;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(var(--halo),.34),rgba(var(--halo),.08) 55%,transparent 72%);pointer-events:none;transition:background .4s ease}
.stage>*{position:relative}
.hero .phone{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{transform:translateY(28px);opacity:.3}to{transform:none;opacity:1}}
.swatches{display:flex;flex-direction:column;align-items:center;gap:10px}
.swatches p{font-size:13px;color:var(--fg-2)}
.sw-row{display:flex;gap:8px;padding:5px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.sw{height:38px;padding:0 12px 0 8px;border-radius:11px;border:1px solid transparent;background:none;color:var(--fg-2);display:flex;align-items:center;gap:8px;font:600 13px/1 var(--body);cursor:pointer}
.sw i{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.sw[aria-pressed="true"]{background:rgba(255,255,255,.08);border-color:var(--line-2);color:var(--fg)}
.sw:hover{color:var(--fg)}
.light .sw-row{background:#fff;border-color:var(--paper-line)}
.light .sw{color:var(--paper-2)}
.light .sw[aria-pressed="true"]{background:var(--paper);border-color:var(--paper-line);color:var(--paper-fg)}
.light .swatches p{color:var(--paper-2)}
@media (max-width:960px){
  .hero-in{grid-template-columns:minmax(0,1fr)}
  .specs{grid-template-columns:1fr 1fr}
  .specs div:nth-child(3){padding-left:0;border-left:0}
  .specs div:nth-child(n+3){border-top:1px solid var(--line);margin-top:18px}
}

/* showcase */
.tabs{display:inline-flex;flex-wrap:wrap;gap:4px;padding:5px;border-radius:16px;background:var(--bg-2);border:1px solid var(--line);margin-bottom:44px}
.tab{height:44px;padding:0 18px;border-radius:12px;border:0;background:none;color:var(--fg-2);font:600 15px/1 var(--body);cursor:pointer}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.tab:not([aria-selected="true"]):hover{color:var(--fg)}
.show{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:56px;align-items:center}
.show-cap{display:flex;flex-direction:column;gap:20px}
.show-cap h3{font-size:clamp(26px,2.8vw,34px);font-weight:800;line-height:1.1;letter-spacing:-.03em}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.checks li{display:flex;gap:12px;align-items:flex-start;line-height:1.45}
.checks li svg{flex:none;margin-top:2px;color:var(--ok)}
.light .checks li svg{color:var(--ok-ink)}
.demo-note{font-size:13px;color:var(--fg-2);display:flex;gap:8px;align-items:center}
.duo{display:flex;gap:28px;justify-content:center;align-items:flex-start}
.duo .phone:nth-child(2){margin-top:64px}
.duo.three .phone:nth-child(3){margin-top:24px}
@media (max-width:960px){
  .show{grid-template-columns:minmax(0,1fr);gap:36px}
  .duo{justify-content:flex-start;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -24px;padding:8px 24px 24px;scrollbar-width:none}
  .duo::-webkit-scrollbar{display:none}
  .duo .phone{scroll-snap-align:center}
  .duo .phone:nth-child(n){margin-top:0}
  .tabs{display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-24px;margin-right:-24px;border-radius:0;border-left:0;border-right:0;padding:5px 24px}
  .tab{flex:none}
}

/* cards / grids */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:960px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:620px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.box{border-radius:22px;padding:28px;background:var(--bg-2);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.light .box{background:var(--card);border-color:var(--paper-line)}
.sol{text-decoration:none;min-height:250px;justify-content:space-between;gap:28px;transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.sol:hover{transform:translateY(-3px);box-shadow:0 24px 48px -28px rgba(11,17,32,.35);border-color:#C3CCDD}
.sol h3{font-size:clamp(22px,2.2vw,28px);font-weight:800;letter-spacing:-.03em;line-height:1.1}
.sol-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.sol-ico{width:52px;height:52px;border-radius:14px;background:var(--paper-fg);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.feat h3{font-size:18px;font-weight:700;line-height:1.25}
.feat p{font-size:15px;line-height:1.5;color:var(--fg-2)}
.light .feat p{color:var(--paper-2)}
.feat .pill{align-self:flex-start}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}

/* steps */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;counter-reset:st;position:relative}
.step{padding:0 24px 0 0;display:flex;flex-direction:column;gap:12px;position:relative}
.step-n{font:800 15px/1 var(--display);width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--paper-fg);color:#fff;position:relative;z-index:1}
.step::before{content:"";position:absolute;top:22px;left:44px;right:0;height:1px;background:var(--paper-line)}
.step:last-child::before{display:none}
.dark .step-n,.sec:not(.light) .step-n{background:var(--fg);color:var(--bg)}
.sec:not(.light) .step::before{background:var(--line-2)}
.step h3{font-size:19px;font-weight:700;margin-top:6px}
.step p{font-size:15px;line-height:1.5}
@media (max-width:860px){.steps{grid-template-columns:1fr 1fr;gap:32px}.step::before{display:none}}
@media (max-width:520px){.steps{grid-template-columns:minmax(0,1fr)}}

/* managed diagram */
.flow{display:grid;grid-template-columns:1fr 44px 1fr 44px 1fr;align-items:stretch}
.flow-col{border-radius:22px;padding:26px;border:1px solid var(--line);background:var(--bg-2);display:flex;flex-direction:column;gap:14px}
.flow-col.mid{border-color:rgba(91,140,255,.45);background:linear-gradient(180deg,rgba(91,140,255,.10),rgba(160,126,255,.05));box-shadow:0 0 0 4px rgba(91,140,255,.06)}
.flow-col h3{font-size:18px;font-weight:800}
.flow-col ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.flow-col li{font-size:15px;line-height:1.45;color:var(--fg-2);padding-left:18px;position:relative}
.flow-col li::before{content:"";position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:50%;background:var(--blue)}
.flow-col li.keep{color:var(--fg)}
.flow-col li.keep::before{background:var(--violet)}
.flow-ar{display:flex;align-items:center;justify-content:center;color:var(--fg-2)}
@media (max-width:900px){.flow{grid-template-columns:minmax(0,1fr)}.flow-ar{height:40px;transform:rotate(90deg)}}
.fit{width:100%;overflow:hidden}
.fit>*{transform-origin:0 0}
.admin-wrap{margin-top:48px;display:flex;flex-direction:column;gap:14px}
.admin-wrap header{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}

/* projects */
.proj{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:40px;align-items:center;border-radius:28px;background:#fff;border:1px solid var(--paper-line);padding:44px;overflow:hidden}
.proj h3{font-size:clamp(26px,2.8vw,36px);font-weight:800;letter-spacing:-.03em;line-height:1.08}
.proj .duo{gap:18px}
.proj-phones{display:flex;gap:16px;justify-content:center;align-items:flex-start}
.proj-phones .phone:nth-child(2){margin-top:40px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{height:30px;padding:0 12px;border-radius:15px;background:var(--paper);border:1px solid var(--paper-line);display:inline-flex;align-items:center;font-size:13px;font-weight:600;color:var(--paper-2)}
@media (max-width:960px){.proj{grid-template-columns:minmax(0,1fr);padding:28px}.proj-phones{justify-content:flex-start;overflow-x:auto;margin:0 -28px;padding:0 28px 8px;scrollbar-width:none}.proj-phones .phone:nth-child(n){margin-top:0}}

/* about */
.about{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:56px;align-items:start}
.facts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.facts div{padding:18px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.facts div:nth-child(odd){padding-right:16px}
.facts dt{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2)}
.facts dd{margin:0;font:700 18px/1.3 var(--display)}
@media (max-width:860px){.about{grid-template-columns:minmax(0,1fr);gap:32px}}

/* lead */
.lead-box{border-radius:30px;border:1px solid var(--line-2);background:radial-gradient(80% 120% at 0% 0%,rgba(91,140,255,.16),transparent 60%),radial-gradient(60% 100% at 100% 100%,rgba(160,126,255,.12),transparent 60%),var(--bg-2);padding:56px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px}
.lead-l{display:flex;flex-direction:column;gap:18px}
.handle{display:inline-flex;align-items:center;gap:12px;margin-top:auto;padding-top:24px;font:700 22px/1 var(--display);text-decoration:none}
.handle span{font:500 14px/1 var(--body);color:var(--fg-2)}
.lead-form{border-radius:22px;background:rgba(7,11,20,.6);border:1px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:16px}
.lead-form label,.lead-form .lbl{font-size:14px;font-weight:600;color:var(--fg-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line-2);background:none;color:var(--fg);font:500 14px/1 var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.lead-form textarea{width:100%;min-height:132px;resize:vertical;border-radius:14px;border:1px solid var(--line-2);background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);padding:14px}
.lead-actions{display:flex;flex-wrap:wrap;gap:10px}
.lead-actions .btn{flex:1}
.copy-st{font-size:13px;color:var(--ok);min-height:18px}
@media (max-width:900px){.lead-box{grid-template-columns:minmax(0,1fr);padding:28px;gap:28px}}

/* page hero */
.phero{position:relative;overflow:hidden;padding:64px 0 80px;border-bottom:1px solid var(--line)}
.phero-in{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center}
.phero h1{font-size:clamp(38px,5.2vw,66px);font-weight:800;line-height:1;letter-spacing:-.045em;margin:20px 0 22px}
.phero.text .phero-in{grid-template-columns:minmax(0,1fr)}
.phero.text h1{max-width:16ch}
@media (max-width:960px){.phero-in{grid-template-columns:minmax(0,1fr)}}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:center}
@media (max-width:960px){.split{grid-template-columns:minmax(0,1fr);gap:32px}}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{padding:14px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px;line-height:1.4}
.light .list li{border-color:var(--paper-line)}
.list li:first-child{border-top:1px solid var(--line)}
.light .list li:first-child{border-top-color:var(--paper-line)}
.bins{display:flex;flex-wrap:wrap;gap:10px}
.bin{height:56px;padding:0 20px;border-radius:14px;border:1px solid var(--paper-line);background:#fff;display:flex;align-items:center;gap:10px;font:700 17px/1 var(--display)}
.bin i{font:600 11px/1 var(--body);font-style:normal;color:var(--paper-2);letter-spacing:.08em}
.note{border-radius:16px;padding:18px 20px;border:1px solid var(--line-2);background:rgba(255,255,255,.03);font-size:15px;line-height:1.5;display:flex;gap:12px;align-items:flex-start}
.note svg{flex:none;margin-top:2px;color:var(--blue)}
.light .note{background:#fff;border-color:var(--paper-line)}
.light .note svg{color:var(--blue-ink)}
.stack{display:flex;flex-direction:column;gap:10px;width:100%;max-width:460px;margin:0 auto}
.stack div{height:64px;border-radius:16px;border:1px solid var(--line-2);background:var(--bg-2);display:flex;align-items:center;padding:0 20px;font:700 16px/1.2 var(--display);position:relative}
.stack div:nth-child(4){border-color:rgba(91,140,255,.55);background:linear-gradient(90deg,rgba(91,140,255,.18),rgba(160,126,255,.12));}
.stack div:nth-child(4)::after{content:"FPH";position:absolute;right:16px;font:700 11px/1 var(--body);letter-spacing:.1em;color:var(--blue)}
.stack div:nth-child(1){width:70%;align-self:center}
.stack div:nth-child(2){width:85%;align-self:center}
.gallery{display:flex;flex-direction:column;gap:56px}
.gal-row{display:flex;flex-direction:column;gap:20px}
.gal-row .duo{justify-content:flex-start}
.gal-row .duo .phone:nth-child(n){margin-top:0}
.co{display:grid;grid-template-columns:220px 1fr;border-top:1px solid var(--paper-line)}
.co dt,.co dd{padding:16px 0;border-bottom:1px solid var(--paper-line);margin:0}
.co dt{color:var(--paper-2);font-size:14px}
.co dd{font-weight:600}
@media (max-width:620px){.co{grid-template-columns:minmax(0,1fr)}.co dt{border-bottom:0;padding-bottom:0}}
.doc{max-width:760px;display:flex;flex-direction:column;gap:28px}
.doc h2{font-size:22px;font-weight:700}
.doc section{display:flex;flex-direction:column;gap:8px}
.doc p{color:var(--paper-2);line-height:1.65}
.draft{border-radius:14px;padding:14px 16px;background:#FFF4DB;color:#6B4700;font-size:14px;font-weight:600}
.nf{min-height:60vh;display:flex;align-items:center}

/* footer */
.ftr{background:var(--bg-2);border-top:1px solid var(--line);padding:64px 0 40px;font-size:15px}
.ftr-top{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px}
.ftr h4{font:600 12px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--fg-2);margin-bottom:16px}
.ftr ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ftr ul a{text-decoration:none;color:var(--fg)}
.ftr ul a:hover{color:var(--blue)}
.ftr-disc{margin-top:48px;padding-top:24px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px;font-size:13px;line-height:1.6;color:var(--fg-2);max-width:900px}
@media (max-width:860px){.ftr-top{grid-template-columns:1fr 1fr}.ftr-top>div:first-child{grid-column:1/-1}}
.sol{justify-content:flex-start}
.sol .arrow-link{margin-top:auto}
.sec,.phero,.hero{overflow-x:clip}
@media (max-width:480px){.hdr-in{gap:12px}.logo{font-size:14px}.logo small{display:none}.logo svg{width:30px;height:30px}.lang a,.lang span{min-width:34px}.hero .phone{--s:.68!important}}

.s-qr svg{width:148px;height:148px}
.box>.pill,.box>.pills{align-self:flex-start}
.stage>.duo{align-self:stretch;width:100%}
.tag-d{background:rgba(255,255,255,.04);border-color:var(--line-2);color:var(--fg);height:36px;font-size:14px}
@media (max-width:960px){.duo .phone{scroll-snap-align:start}}
@media (max-width:960px){.stage>.duo{width:calc(100% + 48px)}.duo{scroll-padding:0 24px}}

/* projects gallery */
.gallery{gap:24px}
.gal-row{display:grid;grid-template-columns:260px minmax(0,1fr);gap:40px;align-items:center;background:#fff;border:1px solid var(--paper-line);border-radius:28px;padding:36px 40px}
.gal-cap{display:flex;flex-direction:column;gap:12px}
.gal-phones{display:flex;gap:28px;justify-content:center;flex-wrap:wrap}
.gal-phones figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:14px}
.gal-phones figcaption{font-size:14px;font-weight:600;color:var(--paper-2)}
@media (max-width:960px){
  .gal-row{grid-template-columns:minmax(0,1fr);padding:24px;gap:20px}
  .gal-phones{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -24px;padding:0 24px 8px;scroll-padding:0 24px;scrollbar-width:none}
  .gal-phones::-webkit-scrollbar{display:none}
  .gal-phones figure{scroll-snap-align:start}
}
.split .swatches{align-items:flex-start}
.stage::before{background:radial-gradient(closest-side,rgba(var(--halo),.46),rgba(var(--halo),.12) 55%,transparent 72%)}

/* ===== Phone frame + app screens (recreated from the ParusPay canvas, brand-parametric) ===== */
.br-ember{--b1:#F04800;--b2:#D63A00;--bi:#C83A00;--bt:#FFF1EA;--bd:#FFB892;--bs:rgba(214,58,0,.32);--g1:255,122,51;--g2:255,79,139;--g3:140,110,255;--t1:#FFE1CF;--t2:#F9ECF1;--halo:255,110,60}
.br-ocean{--b1:#2F6BFF;--b2:#1C4FD8;--bi:#1D4ED8;--bt:#EAF1FF;--bd:#9DBBFF;--bs:rgba(28,79,216,.32);--g1:76,141,255;--g2:34,211,238;--g3:140,110,255;--t1:#DCE8FF;--t2:#EDF2FC;--halo:70,130,255}
.br-mint{--b1:#0E9F6E;--b2:#047857;--bi:#047857;--bt:#E6F7EF;--bd:#86D9B6;--bs:rgba(4,120,87,.30);--g1:30,200,140;--g2:163,230,53;--g3:56,189,248;--t1:#D6F5E6;--t2:#EEF7F2;--halo:40,200,140}
.br-iris{--b1:#7C3AED;--b2:#6025D1;--bi:#6D28D9;--bt:#F1EBFF;--bd:#C4B0FB;--bs:rgba(96,37,209,.32);--g1:167,139,250;--g2:236,72,153;--g3:99,102,241;--t1:#EBE2FF;--t2:#F4EEF9;--halo:150,110,255}

.phone{--s:.7;width:calc(422px*var(--s));height:calc(894px*var(--s));position:relative;flex:none}
.phone-in{position:absolute;left:0;top:0;width:422px;height:894px;box-sizing:border-box;padding:10px;border-radius:64px;background:#07090D;transform:scale(var(--s));transform-origin:0 0;box-shadow:0 0 0 1.5px #2B3346,inset 0 0 0 2px #1A1F2B,0 50px 90px -30px rgba(0,0,0,.7)}
.phone.swap .scr{animation:scrSwap .35s ease}
@keyframes scrSwap{from{filter:saturate(.4) brightness(1.08)}to{filter:none}}
.island{position:absolute;top:21px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#000;z-index:6}

.scr{width:402px;height:874px;border-radius:54px;overflow:hidden;position:relative;color:#121416;font-family:Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:15px;line-height:1.3;text-align:left;
  background:radial-gradient(60% 26% at 10% 3%,rgba(var(--g1),.9) 0%,rgba(var(--g1),0) 70%),radial-gradient(55% 24% at 92% 9%,rgba(var(--g2),.6) 0%,rgba(var(--g2),0) 70%),radial-gradient(70% 28% at 55% 30%,rgba(var(--g3),.32) 0%,rgba(var(--g3),0) 70%),linear-gradient(180deg,var(--t1) 0%,var(--t2) 28%,#F3F1F7 52%,#F3F3F6 100%)}
.scr *{box-sizing:border-box}
.s-status{position:absolute;top:22px;left:40px;right:34px;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:16px;z-index:5;pointer-events:none}
.s-sb{display:flex;gap:6px;align-items:center}
.s-body{padding:62px 16px 0;display:flex;flex-direction:column;gap:12px}
.s-top{height:32px;display:flex;align-items:center;justify-content:space-between}
.s-pill{height:32px;padding:0 14px;border:1px solid rgba(255,255,255,.85);border-radius:16px;background:rgba(255,255,255,.5);font-weight:600;font-size:14px;display:flex;align-items:center;gap:4px;backdrop-filter:blur(16px)}
.s-pill.dots{width:44px;padding:0;justify-content:center}
.s-glass{border-radius:26px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 0 #fff,0 10px 28px rgba(120,60,40,.10);backdrop-filter:blur(22px)}
.s-white{background:#fff;border-radius:28px;box-shadow:0 8px 24px rgba(30,35,45,.05)}
.s-title{padding:12px 4px 4px;display:flex;flex-direction:column;gap:4px}
.s-h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.6px;line-height:1.1}
.s-sub{font-size:15px;color:#3E434B;display:flex;align-items:center;gap:6px}
.s-h2{font-size:22px;font-weight:700;letter-spacing:-.4px}
.s-lbl{font-size:14px;font-weight:600;color:#3E434B}
.s-muted{font-size:13px;color:#646973}
.s-num{font-variant-numeric:tabular-nums}
.s-link{font-size:15px;font-weight:600;color:var(--bi)}
.s-grad{background:linear-gradient(90deg,var(--b1) 0%,rgb(var(--g2)) 55%,#7B3CF0 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.s-coins{display:flex}
.s-coin{width:30px;height:30px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:7.5px;font-weight:800;color:#fff;letter-spacing:-.2px}
.s-coin+.s-coin{margin-left:-6px}
.c-usdt{background:#1A7F5F}.c-sbp{background:#fff;color:#121416;box-shadow:0 0 0 1px #E1E4EA;font-size:8.5px}.c-rub{background:#121416;font-size:15px;font-weight:700}.c-ali{background:#1677FF;font-size:9px}.c-usd{background:#2B2F38;font-size:13px}.c-eur{background:#3B4A8F;font-size:13px}
.s-row{display:flex;align-items:center;gap:12px;padding:10px 0}
.s-ico{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-size:11px;font-weight:800}
.s-rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.s-rt b{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-amt{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:#12805A}
.s-seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:#F0F1F4}
.s-seg span{height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;color:#3E434B}
.s-seg span.on{background:#fff;box-shadow:0 1px 4px rgba(30,35,45,.10);color:#121416;font-weight:600}
.s-fade{position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(to bottom,rgba(243,243,246,0),#F3F3F6 62%);pointer-events:none;z-index:3}
.s-cta{position:absolute;left:16px;right:16px;bottom:28px;height:60px;border-radius:30px;background:linear-gradient(135deg,var(--b1),var(--b2));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 12px 28px var(--bs);color:#fff;font-size:18px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;z-index:4}
.s-cta small{font-size:12px;font-weight:600;opacity:.9}
.s-cta.narrow{left:69px;right:69px;flex-direction:row;gap:10px;font-size:19px;height:64px;border-radius:32px}
.s-swipe{position:absolute;left:16px;right:16px;bottom:28px;height:64px;border-radius:32px;background:rgba(255,255,255,.92);box-shadow:0 12px 30px rgba(120,60,40,.14);display:flex;align-items:center;gap:14px;padding:0 6px;font-size:16px;font-weight:600;z-index:4}
.s-swipe i{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--b1),var(--b2));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px var(--bs)}
.s-field{height:52px;border-radius:16px;background:#F0F1F4;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:16px}
.s-field.ph{color:#8A909B}
.s-chipgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.s-chip{height:56px;border-radius:16px;background:#F0F1F4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:700;font-size:16px;border:1.5px solid transparent}
.s-chip small{font-size:12px;font-weight:500;color:#646973}
.s-chip.on{background:var(--bt);border-color:var(--bi)}
.s-chip.wide{grid-column:1/-1}
.s-kv{display:flex;justify-content:space-between;align-items:center;padding:12px 0;font-size:15px}
.s-kv+.s-kv{border-top:1px solid #E6E8EC}
.s-kv b{font-weight:700}
.s-xbox{background:#F0F1F4;border-radius:20px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center}
.s-xbox .big{font-size:32px;font-weight:700;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.s-cur{height:40px;padding:0 14px 0 6px;border-radius:20px;background:#fff;display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.s-cur .s-coin{width:28px;height:28px;border:0}
.s-swap{position:absolute;left:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:#fff;border:3px solid #F0F1F4;display:flex;align-items:center;justify-content:center}
.s-timer{display:inline-flex;align-items:center;gap:6px;margin-left:8px;padding:2px 8px;border-radius:10px;background:#fff;font-size:13px;font-weight:600}
.s-timer::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid var(--b1);border-right-color:transparent}
.s-badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600}
.bd-green{background:#E3F6EE;color:#0F6B4C}.bd-grey{background:#ECEEF2;color:#3E434B}.bd-red{background:#FDECEC;color:#B42318}.bd-brand{background:#fff;color:var(--bi);border:1px solid var(--bd)}
.s-check{display:flex;gap:10px;align-items:center;font-size:15px}
.s-check i{width:22px;height:22px;border-radius:50%;background:var(--bt);color:var(--bi);display:flex;align-items:center;justify-content:center;flex:none}
.s-nav{position:absolute;left:16px;bottom:28px;width:296px;height:64px;border-radius:32px;background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.95);box-shadow:inset 0 1px 0 #fff,0 12px 30px rgba(120,60,40,.14);backdrop-filter:blur(22px);display:grid;grid-template-columns:repeat(3,1fr);align-items:center;padding:0 5px;z-index:4}
.s-nav span{height:54px;border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:#3E434B}
.s-nav span.on{background:color-mix(in srgb,var(--b1) 11%,transparent);color:var(--bi);font-weight:700}
.s-fab{position:absolute;right:16px;bottom:28px;width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--b1),var(--b2));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 12px 28px var(--bs);color:#fff;display:flex;align-items:center;justify-content:center;z-index:4}
.s-scrim{position:absolute;inset:0;background:rgba(18,20,22,.32);backdrop-filter:blur(6px);z-index:7}
.s-sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:32px 32px 0 0;padding:10px 16px 40px;display:flex;flex-direction:column;gap:14px;z-index:8;box-shadow:0 -12px 40px rgba(18,20,22,.18)}
.s-grab{align-self:center;width:40px;height:5px;border-radius:3px;background:#D9DCE2}
.s-dark-btn{height:56px;border-radius:28px;background:#121416;color:#fff;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px}
.s-ghost-btn{height:52px;border-radius:26px;border:1px solid #E1E4EA;background:#fff;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}

/* card art */
.cart{width:340px;height:214px;border-radius:26px;padding:20px 22px;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;flex:none;box-shadow:0 14px 30px rgba(18,20,22,.18)}
.cart::before,.cart::after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.09);pointer-events:none}
.cart::before{width:420px;height:420px;right:-250px;top:-120px;background:rgba(255,255,255,.035)}
.cart::after{width:300px;height:300px;right:-210px;top:-40px}
.ca-graphite{background:linear-gradient(135deg,#34373F 0%,#1B1D23 55%,#121318 100%)}
.ca-flame{background:linear-gradient(135deg,#D9420E 0%,#9A1F06 60%,#6E1404 100%)}
.ca-sunset{background:linear-gradient(120deg,#FF8A3D 0%,#F2557D 50%,#8B5CF6 100%)}
.cart .t{font-size:14px;opacity:.8;display:flex;align-items:center;gap:6px;position:relative}
.cart .bal{font-size:40px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums;position:relative}
.cart .bt{display:flex;justify-content:space-between;align-items:flex-end;position:relative}
.cart .nm{font-size:15px;font-weight:600;display:flex;flex-direction:column;gap:6px}
.cart .nm span{font-size:15px;letter-spacing:1.5px;opacity:.85}
.minicard{width:88px;height:58px;border-radius:13px;padding:8px 10px;display:flex;flex-direction:column;justify-content:space-between;font-size:15px;font-weight:500}
.mc-silver{background:linear-gradient(125deg,#FBFBFC 0%,#E2E5E9 35%,#C8CDD4 55%,#EFF1F3 75%,#D3D7DD 100%);border:1px solid #E1E4EA}
.mc-holo{background:linear-gradient(120deg,#8EF0CF 0%,#A9CCFF 38%,#E2B8FF 68%,#FFC99E 100%);border:1px solid #D5DEEC}
.mc-add{background:var(--bt);border:1px dashed var(--bd);color:var(--bi);align-items:center;justify-content:center}
.mc-chip{width:12px;height:9px;border-radius:2px;background:#A8AEB7}
.dsw{flex:1;border-radius:16px;padding:6px;display:flex;flex-direction:column;gap:6px;align-items:center;font-size:14px;font-weight:600;border:1.5px solid #E6E8EC}
.dsw.on{border-color:var(--bi);box-shadow:0 0 0 1px var(--bi)}
.dsw i{width:100%;height:46px;border-radius:11px}

/* admin panel */

.adm-nav{height:36px;border-radius:9px;display:flex;align-items:center;gap:10px;padding:0 10px;color:#3E434B;font-weight:500}
.adm-nav.on{background:#FFF1EA;color:#C83A00;font-weight:600}
.adm-nav em{margin-left:auto;font-style:normal;background:#C83A00;color:#fff;border-radius:9px;padding:1px 7px;font-size:11px;font-weight:700}
.adm-c{padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.adm-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.adm-head h4{margin:0;font-size:20px;font-weight:700}
.adm-search{width:280px;height:34px;border-radius:9px;background:#fff;border:1px solid #E1E4EA;display:flex;align-items:center;gap:8px;padding:0 10px;color:#8A909B}
.adm-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.adm-kpi{background:#fff;border:1px solid #E6E8EC;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.adm-kpi b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.adm-kpi span{color:#646973;font-size:12px}
.adm-table{background:#fff;border:1px solid #E6E8EC;border-radius:12px;overflow:hidden}
.adm-table table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.adm-table th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#646973;font-weight:600;text-align:left;padding:10px 12px;background:#FAFBFC;border-bottom:1px solid #E6E8EC}
.adm-table td{padding:10px 12px;border-bottom:1px solid #F0F1F4;white-space:nowrap}
.adm-table tr:last-child td{border-bottom:0}
.adm-table tr.sel td{background:#FFF8F4}
.st{display:inline-flex;height:20px;align-items:center;padding:0 7px;border-radius:10px;font-size:11px;font-weight:600}
.st-ok{background:#E3F6EE;color:#0F6B4C}.st-wait{background:#FFF4DB;color:#8A5A00}.st-na{background:#ECEEF2;color:#3E434B}
.adm-r{background:#fff;border-left:1px solid #E6E8EC;padding:18px 16px;display:flex;flex-direction:column;gap:12px;min-height:0}
.adm-r h5{margin:0;font-size:14px;font-weight:700}
.adm-msg{padding:10px 12px;border-radius:12px;background:#F0F1F4;line-height:1.4;max-width:240px}
.adm-msg.me{align-self:flex-end;background:#FFF1EA}
.adm-msg small{display:block;color:#646973;font-size:11px;margin-top:4px}
.adm-reply{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.adm-reply span{height:64px;border-radius:10px;border:1px solid #E1E4EA;padding:10px;color:#8A909B}
.adm-reply div{display:flex;gap:8px}
.adm-reply b{flex:1;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:600}
.adm-reply b.p{background:#121416;color:#fff}.adm-reply b.s{border:1px solid #E1E4EA}

.adm-logo{white-space:nowrap;font-size:13px}

</style>

/* deterministic pseudo-QR */
const QR = (() => {
  const n = 25, c = 6; let seed = 7, r = '';
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const finder = (x, y) => x < 7 && y < 7 || x >= n - 7 && y < 7 || x < 7 && y >= n - 7;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { if (finder(x, y)) continue; if (rnd() > .52) r += `M${x*c} ${y*c}h${c}v${c}h-${c}z`; }
  const f = (x, y) => `<rect x="${x*c+3}" y="${y*c+3}" width="${6*c}" height="${6*c}" rx="7" fill="none" stroke="#121416" stroke-width="${c}"/><rect x="${x*c+2*c}" y="${y*c+2*c}" width="${3*c}" height="${3*c}" rx="3" fill="#121416"/>`;
  return `<svg width="176" height="176" viewBox="0 0 ${n*c} ${n*c}" aria-hidden="true"><path d="${r}" fill="#121416"/>${f(0,0)}${f(n-7,0)}${f(0,n-7)}</svg>`;
})();

    <div><span class="eyebrow">${P.eyebrow}</span><h1>${P.h1}</h1><p class="lead-p muted">${P.sub}</p>${P.cta ? `<div class="ctas">${tgBtn(P.cta)}</div>` : ''}${extra}</div>
    ${visual ? `<div>${visual}</div>` : ''}</div></section>`;
}

/* ---------- routing ---------- */
function parse(){
  const h = decodeURIComponent(location.hash.slice(1));
  const m = h.match(/^(en|ru)(?:-([a-z0-9]+))?$/);
  if (!h) return { lang: /^ru/i.test(navigator.language || '') ? 'ru' : 'en', page:'home', anchor:null };
  if (h === 'main') return null;
  if (!m) return { lang:S.lang, page:'404', anchor:null };
  const p = m[2];
  if (!p) return { lang:m[1], page:'home', anchor:null };
  if (ANCHORS.includes(p)) return { lang:m[1], page:'home', anchor:p };
  return { lang:m[1], page: ROUTES.includes(p) ? p : '404', anchor:null };
}
function render(scroll = true){
  const r = parse(); if (!r) return;
  const prevPage = S.page, prevLang = S.lang;
  Object.assign(S, r);
  const tp = { wallet:0, cards:1, payments:2, development:3 }[S.page];
  if (tp != null) S.topic = tp;
  const L = T[S.lang];
  document.documentElement.lang = S.lang;
  document.title = S.page === 'home' ? L.meta.home : `${L.meta[S.page]} · Fintech Provider Hub`;
  document.getElementById('app').innerHTML = header(L) + `<main id="main" tabindex="-1">${PAGES[S.page](L)}</main>` + footer(L);
  fit();
  if (!scroll) return;
  if (S.anchor) { const el = document.getElementById(S.anchor); if (el) requestAnimationFrame(() => el.scrollIntoView({ block:'start' })); }
  else if (prevPage !== S.page || prevLang === S.lang) window.scrollTo(0, 0);
  track('page_view', { page:S.page, lang:S.lang });
}
function fit(){
  document.querySelectorAll('[data-fit]').forEach(b => {
    const c = b.firstElementChild, w = +b.dataset.fit, s = Math.min(1, b.clientWidth / w);
    c.style.transform = `scale(${s})`; b.style.height = Math.ceil(c.offsetHeight * s) + 'px';
  });
}
function setBrand(b){
  S.brand = b; store.set('fph-brand', b);
  document.querySelectorAll('.brandable').forEach(el => {
    el.className = el.className.replace(/\bbr-\w+/, 'br-' + b);
    if (el.classList.contains('phone')) { el.classList.remove('swap'); void el.offsetWidth; el.classList.add('swap'); }
  });
  document.querySelectorAll('[data-brand]').forEach(x => x.setAttribute('aria-pressed', x.dataset.brand === b));
  track('brand_preview', { brand:b });
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-brand],[data-tab],[data-topic],[data-copy],[data-menu],[data-ev],a[href^="#"]');
  if (!t) return;
  if (t.dataset.ev) track(t.dataset.ev, { page:S.page, lang:S.lang });
  if (t.dataset.brand) return setBrand(t.dataset.brand);
  if (t.dataset.tab) {
    S.tab = t.dataset.tab;
    document.querySelectorAll('[data-tab]').forEach(x => x.setAttribute('aria-selected', x.dataset.tab === S.tab));
    document.getElementById('show-stage').outerHTML = showStage(T[S.lang]);
    return;
  }
  if (t.dataset.topic != null) {
    S.topic = +t.dataset.topic; const ld = T[S.lang].lead;
    document.querySelectorAll('[data-topic]').forEach(x => x.setAttribute('aria-pressed', +x.dataset.topic === S.topic));
    document.getElementById('lead-msg').value = ld.tpl(ld.topics[S.topic]);
    return;
  }
  if (t.hasAttribute('data-copy')) {
    const ld = T[S.lang].lead, ta = document.getElementById('lead-msg'), st = document.getElementById('copy-st');
    const fail = () => { ta.focus(); ta.select(); st.textContent = ld.copyFail; st.style.color = '#F5B94A'; };
    try { navigator.clipboard.writeText(ta.value).then(() => { st.textContent = ld.copied + ' ✓'; st.style.color = ''; track('copy_message'); }, fail); } catch(err){ fail(); }
    return;
  }
  if (t.hasAttribute('data-menu')) {
    const h = document.getElementById('hdr'), open = !h.classList.contains('open');
    h.classList.toggle('open', open); t.setAttribute('aria-expanded', open);
    t.setAttribute('aria-label', open ? T[S.lang].nav.close : T[S.lang].nav.menu);
    document.body.style.overflow = open ? 'hidden' : '';
    return;
  }
  if (t.hasAttribute('data-skip')) { e.preventDefault(); document.getElementById('main').focus(); return; }
  if (t.matches('a[href^="#"]')) {
    document.body.style.overflow = '';
    const raw = t.getAttribute('href');
    const target = t.dataset.goto ? href(S.lang, t.dataset.goto) : raw;
    if (t.dataset.goto) { e.preventDefault(); location.hash = target.slice(1); }
    if (('#' + decodeURIComponent(location.hash.slice(1))) === target) { e.preventDefault(); render(); }
  }
});
window.addEventListener('hashchange', () => render());
window.addEventListener('resize', () => { clearTimeout(window.__ft); window.__ft = setTimeout(fit, 80); });
render(false);
if (S.anchor) { const el = document.getElementById(S.anchor); if (el) el.scrollIntoView({ block:'start' }); }

</script>
